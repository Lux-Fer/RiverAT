<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RiverAT</title>
  <style>
    :root { color-scheme: light; }
    body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
           margin: 2rem auto; max-width: 960px; padding: 0 1rem;
           color: #1f2933; background: #f7f9fb; }
    h1 { font-size: 1.4rem; margin-bottom: .25rem; }
    h1 a { color: inherit; text-decoration: none; }
    .muted { color: #616e7c; font-size: 13px; }
    table { border-collapse: collapse; width: 100%; background: #fff;
            box-shadow: 0 1px 2px rgba(0,0,0,.06); border-radius: 6px; overflow: hidden; }
    th, td { padding: .55rem .75rem; border-bottom: 1px solid #e4e7eb;
             text-align: left; font-size: 14px; vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    a { color: #1c7ed6; text-decoration: none; }
    .badge { display: inline-block; padding: .12rem .5rem; border-radius: 999px;
             font-size: 12px; color: #fff; }
    .passed { background: #2f9e44; }
    .failed { background: #e03131; }
    .error { background: #c2255c; }
    .skipped { background: #868e96; }
    .blocked { background: #f08c00; }
    .running, .queued { background: #1c7ed6; }
    details { margin-top: .35rem; }
    .card { background: #fff; padding: .5rem .9rem; border-radius: 6px;
            box-shadow: 0 1px 2px rgba(0,0,0,.06); }
    pre { background: #f1f3f5; padding: .5rem .75rem; border-radius: 4px;
          white-space: pre-wrap; word-break: break-all; font-size: 12px; }
  </style>
</head>
<body>
  <div style="display:flex; justify-content:space-between; align-items:baseline;">
    <h1><a href="/">RiverAT</a></h1>
    {% if user %}
    <form method="post" action="/logout" style="margin:0;">
      <span class="muted">{{ user.display_name }}（{{ user.role }}）</span>
      <button type="submit"
              style="margin-left:.5rem; padding:.2rem .6rem; cursor:pointer;">退出</button>
    </form>
    {% endif %}
  </div>
  <p class="muted" style="margin-top:-.4rem">
    <a href="/">执行记录</a> · <a href="/products">产品树</a> · <a href="/plans">计划</a>
    {% if user and user.role == "admin" %} · <a href="/users">用户</a>{% endif %}
    · 产品组合自动化测试平台 v0
  </p>
  {% block content %}{% endblock %}
</body>
</html>
