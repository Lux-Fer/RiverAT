services:
  db:
    image: postgres:17
    container_name: riverat-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: riverat
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: riverat
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riverat -d riverat"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7
    container_name: riverat-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: riverat-backend:0.1.1
    container_name: riverat-backend
    restart: unless-stopped
    # V0.1.1：模型端点等配置从本地 .env 注入（缺失时不报错）
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      APP_ENV: prod
      DEBUG: "false"
      # 生产必须换：SECRET_KEY 同时用于会话与测试机凭据加密
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      DATABASE_URL: postgresql+asyncpg://riverat:123456@db:5432/riverat
      REDIS_URL: redis://redis:6379/0
      # 首次启动、库里没有用户时建管理员
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CORS_ORIGINS: '["http://localhost:8000"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/var:/app/backend/var
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: riverat-backend:0.1.1
    container_name: riverat-worker
    restart: unless-stopped
    entrypoint: ["python", "-m", "app.worker"]
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      APP_ENV: prod
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      DATABASE_URL: postgresql+asyncpg://riverat:123456@db:5432/riverat
      REDIS_URL: redis://redis:6379/0
      RIVERAT_DOCS_ROOT: /app/backend/var/documents
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./backend/var:/app/backend/var

volumes:
  pgdata:
  redisdata: