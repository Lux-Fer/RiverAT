{% extends "base.html" %}
{% block body_class %}river login{% endblock %}
{% block head %}
  <link rel="stylesheet" href="/static/river.css?v=20261219">
{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="login-kicker">内网部署</div>
  <h1>登录</h1>

  {% if error %}<p class="login-error" role="alert">{{ error }}</p>{% endif %}

  <form method="post" action="/login" class="login-form">
{% include "_csrf_input.html" %}
    <label>
      <span class="k">用户名</span>
      <input name="username" value="{{ username or '' }}" required
             autocomplete="username" autofocus>
    </label>
    <label>
      <span class="k">密码</span>
      <input name="password" type="password" required autocomplete="current-password">
    </label>
    <div class="login-actions">
      <button type="submit" class="act-primary">进入 →</button>
    </div>
  </form>

  <p class="login-foot">账号由管理员分配；忘记密码请联系管理员。</p>
</div>
{% endblock %}
