{% extends "base.html" %}
{% block content %}
  <h2 class="page-title">手动创建任务</h2>
  <p class="page-lede">
    模型不可用或不想用模型时，直接选工具、填参数。生成的是<b>草案</b>，仍要确认后才会执行。
  </p>

  {% if error %}<p class="notice bad">{{ error }}</p>{% endif %}
  {% if not tools %}
  <p class="notice bad">还没有审核通过的工具，先去 <a href="/tools">工具</a> 上传并让 admin 审核。</p>
  {% endif %}

  <div class="card">
    <form method="post" action="/tasks/manual">
{% include "_csrf_input.html" %}
      <div class="grid-2">
        <select name="product_id">
          <option value="">被测产品（可选）</option>
          {% for p in products %}
          <option value="{{ p.id }}">{{ p.code }} · {{ p.name }}</option>
          {% endfor %}
        </select>
        <select name="tool_id" required>
          <option value="">选择工具</option>
          {% for t in tools %}
          <option value="{{ t.id }}">{{ t.name }} · {{ t.version }}</option>
          {% endfor %}
        </select>
        <input name="title" placeholder="任务标题（可选，默认用工具名）" style="grid-column:1/-1;">
      </div>
      <p style="margin:12px 0 6px;" class="muted">参数（JSON，按工具的 input_schema 校验）：</p>
      <textarea name="args" rows="5" class="mono" required
                style="width:100%; font-size:12px;">{}</textarea>
      <p class="row" style="margin:14px 0 0;">
        <button type="submit" class="btn btn-primary">生成草案</button>
        <a href="/tasks">返回任务</a>
      </p>
    </form>
  </div>
{% endblock %}
